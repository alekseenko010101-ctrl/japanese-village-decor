name: Build NeoForge Mod From ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack source zip
        run: |
          mkdir extracted
          unzip -q japanese_village_decor_neoforge_source.zip -d extracted
          PROJECT_DIR=$(find extracted -name "build.gradle" -type f -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: japanese-village-decor-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
