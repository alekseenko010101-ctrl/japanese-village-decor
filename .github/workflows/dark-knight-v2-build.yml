name: Dark Knight V2 Build
on:
  push:
    branches: [dark-knight-mod]
    paths:
      - 'dark-knight-v2/**'
      - '.github/workflows/dark-knight-v2-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dark-knight-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Verify embedded assets
        run: |
          jar tf build/libs/sleepless-knight-2.0.0.jar | grep 'assets/sleepless_knight/textures/entity/dark_knight.png'
          jar tf build/libs/sleepless-knight-2.0.0.jar | grep 'assets/sleepless_knight/textures/item/dark_knight_spawn_egg.png'
          jar tf build/libs/sleepless-knight-2.0.0.jar | grep 'assets/sleepless_knight/lang/ru_ru.json'
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: sleepless-knight-v2-jar
          path: dark-knight-v2/build/libs/sleepless-knight-2.0.0.jar
