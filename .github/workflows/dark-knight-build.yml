name: Dark Knight Build
on:
  push:
    branches: [dark-knight-mod]
    paths:
      - 'dark-knight/**'
      - '.github/workflows/dark-knight-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dark-knight
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: sleepless-knight-jar
          path: dark-knight/build/libs/sleepless-knight-1.0.0.jar
