name: Dark Knight Rebuild V3
on:
  push:
    branches: [dark-knight-rebuild-v3]
    paths:
      - 'dark-knight-v3/**'
      - '.github/workflows/dark-knight-v3-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dark-knight-v3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Verify assets
        run: |
          jar tf build/libs/sleepless-knight-3.0.0.jar | grep 'assets/sleepless_knight/textures/entity/dark_knight.png'
          jar tf build/libs/sleepless-knight-3.0.0.jar | grep 'assets/sleepless_knight/textures/item/dark_knight_spawn_egg.png'
          jar tf build/libs/sleepless-knight-3.0.0.jar | grep 'assets/sleepless_knight/lang/ru_ru.json'
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: sleepless-knight-v3-jar
          path: dark-knight-v3/build/libs/sleepless-knight-3.0.0.jar
