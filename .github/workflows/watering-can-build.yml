name: Build Wooden Watering Can 1.0.3

on:
  push:
    branches:
      - watering-can-1-0-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        shell: bash
        run: |
          cat watering-can-payload/part-*.b64 | base64 --decode > watering-can-source.zip
          unzip -t watering-can-source.zip
          rm -rf watering-can-project
          mkdir watering-can-project
          unzip -q watering-can-source.zip -d watering-can-project
          rsync -a watering-can-patches/ watering-can-project/mod/

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        working-directory: watering-can-project/mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Collect and verify distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          JAR=$(find watering-can-project/mod/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          cp "$JAR" output/wooden-watering-can-1.0.3.jar
          unzip -t output/wooden-watering-can-1.0.3.jar
          javap -classpath output/wooden-watering-can-1.0.3.jar -p -c ru.kasper.woodenwateringcan.item.WoodenWateringCanItem > item.javap
          javap -classpath output/wooden-watering-can-1.0.3.jar -p -c ru.kasper.woodenwateringcan.interaction.WoodenBucketFillHandler > bucket.javap
          grep -q 'BoneMealItem' item.javap
          grep -q 'FARMLAND' item.javap
          grep -q 'BUCKET_FILL' bucket.javap
          grep -q 'SPLASH' bucket.javap
          unzip -p output/wooden-watering-can-1.0.3.jar data/wooden_watering_can/recipe/wooden_watering_can.json > /tmp/recipe.json
          test -s /tmp/recipe.json
          unzip -p output/wooden-watering-can-1.0.3.jar fabric.mod.json | grep -q '1.0.3'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: wooden-watering-can-1.0.3
          path: output/wooden-watering-can-1.0.3.jar
          if-no-files-found: error
