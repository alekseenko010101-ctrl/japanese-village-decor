name: Build Wooden Watering Can

on:
  push:
    branches:
      - watering-can-build-26-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat watering-can-payload/part-*.b64 | base64 --decode > watering-can-source.zip
          unzip -t watering-can-source.zip
          rm -rf watering-can-project
          mkdir watering-can-project
          unzip -q watering-can-source.zip -d watering-can-project

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        working-directory: watering-can-project/mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Collect distributable JAR
        shell: bash
        run: |
          mkdir -p output
          find watering-can-project/mod/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} output/ \;
          ls -la output

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: wooden-watering-can-fabric-26.2
          path: output/*.jar
          if-no-files-found: error
