name: Build Wooden Bucket 3D 1.1.6 Patch

on:
  push:
    branches:
      - wb3d-1-1-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct 1.1.4 build project
        shell: bash
        run: |
          cat wb3d-1.1.4-payload/part-*.b64 | base64 --decode > wb114-project.zip
          echo "f1b420644748453c15e844981a31a8b758b0e213baf359597e2accfcb093e3a3  wb114-project.zip" | sha256sum -c -
          unzip -t wb114-project.zip
          unzip -q wb114-project.zip
          install -D wb3d-1.1.6-src/WoodenBucketBottleMechanics.java wb114/src/main/java/dev/kasper/woodenbucket3d/WoodenBucketBottleMechanics.java

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build patch
        working-directory: wb114
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_JAR=$(find wb114/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          cp "$PATCH_JAR" wooden-bucket-3d-1.1.6-patch.jar
          unzip -t wooden-bucket-3d-1.1.6-patch.jar
          javap -classpath wooden-bucket-3d-1.1.6-patch.jar -p -c dev.kasper.woodenbucket3d.WoodenBucketBottleMechanics > mechanics.javap
          grep -q 'wooden_water_bucket_level_2' mechanics.javap
          grep -q 'wooden_milk_bucket_level_1' mechanics.javap
          grep -q 'wooden_powder_snow_bucket_level_2' mechanics.javap
          ! grep -q 'wooden_fish_bottle' mechanics.javap

      - name: Upload patch JAR
        uses: actions/upload-artifact@v4
        with:
          name: wooden-bucket-3d-1.1.6-patch
          path: wooden-bucket-3d-1.1.6-patch.jar
          if-no-files-found: error
