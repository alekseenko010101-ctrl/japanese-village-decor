name: Build Wooden Bucket 3D 1.1.4

on:
  push:
    branches:
      - wb3d-fix-1-1-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project
        shell: bash
        run: |
          cat wb3d-1.1.4-payload/part-*.b64 | base64 --decode > wb114-project.zip
          echo "f1b420644748453c15e844981a31a8b758b0e213baf359597e2accfcb093e3a3  wb114-project.zip" | sha256sum -c -
          unzip -t wb114-project.zip
          unzip -q wb114-project.zip

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build extension
        working-directory: wb114
        run: gradle clean build --no-daemon --stacktrace

      - name: Merge with Wooden Bucket 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          PATCH_JAR=$(find wb114/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          rm -rf final-jar patch-jar output
          mkdir -p final-jar patch-jar output
          unzip -q wb114/libs/wooden-bucket-3d-1.1.3.jar -d final-jar
          unzip -q "$PATCH_JAR" -d patch-jar

          python3 - <<'PY'
          import json
          from pathlib import Path
          for lang in ('ru_ru.json', 'en_us.json'):
              base = Path('final-jar/assets/wooden_bucket/lang') / lang
              patch = Path('patch-jar/assets/wooden_bucket/lang') / lang
              data = json.loads(base.read_text(encoding='utf-8')) if base.exists() else {}
              data.update(json.loads(patch.read_text(encoding='utf-8')))
              base.parent.mkdir(parents=True, exist_ok=True)
              base.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rsync -a --exclude='META-INF/' --exclude='assets/wooden_bucket/lang/' patch-jar/ final-jar/
          jar --create --file output/wooden-bucket-3d-1.1.4+mc26.2.jar -C final-jar .
          unzip -t output/wooden-bucket-3d-1.1.4+mc26.2.jar
          javap -classpath output/wooden-bucket-3d-1.1.4+mc26.2.jar -p dev.kasper.woodenbucket3d.WoodenBucketBottleMechanics

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: wooden-bucket-3d-1.1.4-mc26.2
          path: output/wooden-bucket-3d-1.1.4+mc26.2.jar
          if-no-files-found: error
