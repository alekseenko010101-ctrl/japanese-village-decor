name: Build Wooden Bucket 3D 1.1.5

on:
  push:
    branches:
      - wb3d-1-1-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack patch project
        shell: bash
        run: |
          echo "10c000ff4403d3334203f09c2a438c6ee0517785ac838dae3fcc37c98d03a520  wb115-project.zip" | sha256sum -c -
          unzip -t wb115-project.zip
          unzip -q wb115-project.zip

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build patch
        working-directory: wb115
        run: gradle clean build --no-daemon --stacktrace

      - name: Merge with Wooden Bucket 1.1.4
        shell: bash
        run: |
          set -euo pipefail
          PATCH_JAR=$(find wb115/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          rm -rf final-jar patch-jar output
          mkdir -p final-jar patch-jar output
          unzip -q wb115/libs/wooden-bucket-3d-1.1.4.jar -d final-jar
          unzip -q "$PATCH_JAR" -d patch-jar

          python3 - <<'PY'
          import json
          from pathlib import Path
          for lang in ('ru_ru.json', 'en_us.json'):
              base = Path('final-jar/assets/wooden_bucket/lang') / lang
              patch = Path('patch-jar/assets/wooden_bucket/lang') / lang
              data = json.loads(base.read_text(encoding='utf-8')) if base.exists() else {}
              if patch.exists():
                  data.update(json.loads(patch.read_text(encoding='utf-8')))
              base.parent.mkdir(parents=True, exist_ok=True)
              base.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rsync -a --exclude='META-INF/' --exclude='assets/wooden_bucket/lang/' patch-jar/ final-jar/
          jar --create --file output/wooden-bucket-3d-1.1.5+mc26.2.jar -C final-jar .
          unzip -t output/wooden-bucket-3d-1.1.5+mc26.2.jar
          javap -classpath output/wooden-bucket-3d-1.1.5+mc26.2.jar -p -c dev.kasper.woodenbucket3d.WoodenBucketBottleMechanics > mechanics.javap
          grep -q 'wooden_water_bucket_decor_level_2' mechanics.javap
          grep -q 'wooden_water_bucket_decor_level_1' mechanics.javap
          grep -q 'wooden_milk_bucket_decor_level_2' mechanics.javap
          grep -q 'wooden_powder_snow_bucket_decor_level_1' mechanics.javap
          test -f final-jar/assets/wooden_bucket/blockstates/wooden_water_bucket_decor_level_2.json
          test -f final-jar/assets/wooden_bucket/models/block/water_level_1.json
          python3 - <<'PY'
          import json
          data=json.load(open('final-jar/fabric.mod.json', encoding='utf-8'))
          assert data['version'] == '1.1.5+mc26.2'
          PY

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: wooden-bucket-3d-1.1.5-mc26.2
          path: output/wooden-bucket-3d-1.1.5+mc26.2.jar
          if-no-files-found: error
